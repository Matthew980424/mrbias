# ====================================================================================================================
# Global settings
# ====================================================================================================================
global:
  output_directory: "output_20260512" # use forward slashes in filepath
  overwrite_existing_output: True

# ====================================================================================================================
# PHANTOM/EXPERIMENT configuration
# ====================================================================================================================
phantom_experiment:
  phantom_manufacturer: "caliber_mri" # options include [caliber_mri, eurospin]
  phantom_type: "diffusion_phantom"      # options include [system_phantom, relaxometry, diffusion_phantom]
  phantom_serial_number: "Emer-0908"   # for CalibreMRI phantoms SN has format XXX-XXXX
  field_strength_tesla: 1.5           # options include [1.5, 3.0]
  temperature_celsius: 20

# ====================================================================================================================
# DICOM sorting options
# ====================================================================================================================
dicom_sorting:
  scan_protocol : "diff_philips_marlin_Emer"   # options include [philips_marlin_Emer, diff_philips_marlin_Emer]
  scan_protocol_options: ["philips_marlin_Emer", "diff_philips_marlin_Emer"]
  save_sorted_images: False # future feature (not implemented)


# ====================================================================================================================
# ROI detection options
# ====================================================================================================================
roi_detection:
  template_name: "philips_mrlinac_1p5T_emer_m2600512A"   # options include [siemens_skyra_3p0T, philips_mrlinac_1p5T_emer]
  use_manual_roi: False
  registration_method: "two_stage_msme-GS_correl-GD" #"mattesMI-GD"
  save_mask_images: False # future feature (not implemented)


# ====================================================================================================================
# Curve fitting options
# ====================================================================================================================
curve_fitting:
  # -----------------------------------------------------------------------------------------------------------------
  # PRE-PROCESSING
  # -----------------------------------------------------------------------------------------------------------------
  averaging: "voxels_in_ROI"              # options include [none, voxels_in_ROI]
  normalisation: "voxel_max"              # options include [none, voxel_max, roi_max]
  exclude: "clipped"                      # options include [none, clipped]
  percent_clipped_threshold: 100           # [0, 100] for parital clipping, the number of unclipped/clean voxels required across all measurements in the ROI
  # -----------------------------------------------------------------------------------------------------------------
  # MODEL OPTIONS
  # -----------------------------------------------------------------------------------------------------------------
  t1_vfa_options:
    fitting_models: ["2_param"]             #
    angle_exclusion_list: []              # angles to exclude
    angle_exclusion_label: ""        # a label to mark the exclusion scenario (may want to run multiple)
    use_2D_roi: False                       #  to use a 3D ROI or a central 2D slice ROI
  t1_vir_options:
    fitting_models: ["4_param"] # options include: 2_param (abs(a * (1 - 2 * np.exp(-IR/t1)))), # "2_param", "3_param",
                                                      #                : 3_param (abs(a * (1 - b * np.exp(-IR/t1))))
    inversion_exclusion_list: []           # inversion times to exclude
    inversion_exclusion_label: ""         # a label to mark the exclusion scenario (may want to run multiple)
  t2_mse_options:
    fitting_models: ["3_param"] # options include: 3_param (a * np.exp(-t/t2) + b)
    echo_exclusion_list: []              # echo times to exclude
    echo_exclusion_label: ""          # a label to mark the exclusion scenario (may want to run multiple)

  dw_options: #t1_vfa_options
    fitting_models: [ "3_param" ] # options include: "3_param" (S(Bx) = S(0) * exp(-Bx * D)) and '4_param' (S(Bx) = S(0) * exp(-Bx * D + c) )
    bval_exclusion_list: [0]
    bval_exclusion_label: ["B0 Exclude"]
#    use_2D_roi: True
#    slice_offset_2D_list: [0]
#    slice_offset_2D_list: [0]
  # -----------------------------------------------------------------------------------------------------------------
  # OUTPUT OPTIONS
  # -----------------------------------------------------------------------------------------------------------------
  save_voxel_data: True
  save_parameter_maps: False # future feature (not implemented)


